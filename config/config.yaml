models:
  embedding_model: text-embedding-3-small
  generation_model: gpt-4o-mini

index:
  traffic_collection: traffic_events
  docs_collection: docs_chunks
  batch_size: 128
  rebuild: false

retrieval:
  # API callers may explicitly pass 0 to disable retrieval. Product surfaces
  # should default to a small non-zero value so lineage is available.
  top_k: 5
  recommended_top_k: 5
  provider: auto
  local_lexical_scan_limit: 10000
  preload_local_metadata: true
  local_synthesis_provider: auto
  ollama_base_url: http://127.0.0.1:11434
  ollama_model: qwen2.5:7b-instruct
  ollama_timeout_seconds: 30
  ollama_max_output_tokens: 600
  strict_mode: true
  strict_distance_threshold: 0.42
  bbox_candidate_limit: 20000

pdf:
  chunk_size: 1200
  chunk_overlap: 200

paths:
  persist_dir: data/chroma

vector_db:
  mode: local
  chroma_host: ""
  chroma_port: 8000
  chroma_ssl: false
  chroma_tenant: default_tenant
  chroma_database: default_database
  chroma_auth_header: Authorization

predict:
  processed_dir: data/processed
  model_dir: models
  min_points: 5
  top_k: 5
  destination:
    min_samples_per_class: 200
    max_classes: 80
    max_train_rows: 120000
    max_test_rows: 30000
    report_top_classes: 25
  eta:
    max_train_rows: 120000
    max_test_rows: 30000
  anomaly:
    max_rows: 120000

kpi:
  occupancy_max_expanded_rows: 3500000
  congestion_formula: pressure_v2
  pressure_arrivals_weight: 0.60
  pressure_dwell_weight: 0.40
  pressure_ratio_clip: [0.0, 5.0]
  voyage_max_gap_days: 30

forecast:
  default_horizon_weeks: 4
  min_history_days: 60
  backtest_days: 28
  maximum_horizon_weeks: 8
  mase_max_exclusive: 1.0
  interval_80_coverage_range: [0.70, 0.90]

carbon:
  factor_registry_path: config/carbon_factors.v1.json
  monte_carlo_draws: 500
  default_boundary: TTW
  relative_level_percentiles: [0.25, 0.50, 0.75]
  default_pollutants:
    - CO2e
    - NOx
    - SOx
    - PM
